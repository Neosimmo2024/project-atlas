name: CI Supabase

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/foundation-ui
      - feat/recruitment-pipeline-domain
      - feat/recruitment-pipeline-ui
      - feat/preproduction-security-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-local:
    name: Supabase local QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      PEOPLE_E2E_BASE_URL: http://127.0.0.1:3000
      ORGANIZATIONS_E2E_BASE_URL: http://127.0.0.1:3000
      RELATIONSHIPS_E2E_BASE_URL: http://127.0.0.1:3000
      INTERACTIONS_E2E_BASE_URL: http://127.0.0.1:3000
      TASKS_E2E_BASE_URL: http://127.0.0.1:3000
      TIMELINE_E2E_BASE_URL: http://127.0.0.1:3000
      PROJECTS_E2E_BASE_URL: http://127.0.0.1:3000
      FOUNDATION_UI_E2E_BASE_URL: http://127.0.0.1:3000
      PIPELINE_E2E_BASE_URL: http://127.0.0.1:3000
      CSV_IMPORT_E2E_BASE_URL: http://127.0.0.1:3000
      PEOPLE_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      PEOPLE_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test
      PEOPLE_TEST_NO_TENANT_EMAIL: qa-no-tenant@atlas.local.test
      ORGANIZATIONS_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      ORGANIZATIONS_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test
      ORGANIZATIONS_TEST_NO_TENANT_EMAIL: qa-no-tenant@atlas.local.test
      RELATIONSHIPS_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      RELATIONSHIPS_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test
      RELATIONSHIPS_TEST_NO_TENANT_EMAIL: qa-no-tenant@atlas.local.test
      INTERACTIONS_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      INTERACTIONS_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test
      INTERACTIONS_TEST_NO_TENANT_EMAIL: qa-no-tenant@atlas.local.test
      TASKS_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      TASKS_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test
      TASKS_TEST_NO_TENANT_EMAIL: qa-no-tenant@atlas.local.test
      TIMELINE_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      TIMELINE_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test
      TIMELINE_TEST_NO_TENANT_EMAIL: qa-no-tenant@atlas.local.test
      ACTION_PLAN_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      ACTION_PLAN_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test
      ACTION_PLAN_TEST_NO_TENANT_EMAIL: qa-no-tenant@atlas.local.test
      PROJECTS_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      PROJECTS_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test
      FOUNDATION_UI_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      PIPELINE_TEST_TENANT_A_EMAIL: qa-tenant-a-owner@atlas.local.test
      PIPELINE_TEST_TENANT_B_EMAIL: qa-tenant-b-owner@atlas.local.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generate local QA credentials
        shell: bash
        run: |
          set -euo pipefail
          tenant_a_password="$(openssl rand -base64 32)"
          tenant_b_password="$(openssl rand -base64 32)"
          no_tenant_password="$(openssl rand -base64 32)"
          echo "::add-mask::$tenant_a_password"
          echo "::add-mask::$tenant_b_password"
          echo "::add-mask::$no_tenant_password"
          {
            echo "QA_TENANT_A_PASSWORD=$tenant_a_password"
            echo "QA_TENANT_B_PASSWORD=$tenant_b_password"
            echo "QA_NO_TENANT_PASSWORD=$no_tenant_password"
            echo "PEOPLE_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "PEOPLE_TEST_TENANT_B_PASSWORD=$tenant_b_password"
            echo "PEOPLE_TEST_NO_TENANT_PASSWORD=$no_tenant_password"
            echo "ORGANIZATIONS_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "ORGANIZATIONS_TEST_TENANT_B_PASSWORD=$tenant_b_password"
            echo "ORGANIZATIONS_TEST_NO_TENANT_PASSWORD=$no_tenant_password"
            echo "RELATIONSHIPS_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "RELATIONSHIPS_TEST_TENANT_B_PASSWORD=$tenant_b_password"
            echo "RELATIONSHIPS_TEST_NO_TENANT_PASSWORD=$no_tenant_password"
            echo "INTERACTIONS_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "INTERACTIONS_TEST_TENANT_B_PASSWORD=$tenant_b_password"
            echo "INTERACTIONS_TEST_NO_TENANT_PASSWORD=$no_tenant_password"
            echo "TASKS_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "TASKS_TEST_TENANT_B_PASSWORD=$tenant_b_password"
            echo "TASKS_TEST_NO_TENANT_PASSWORD=$no_tenant_password"
            echo "TIMELINE_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "TIMELINE_TEST_TENANT_B_PASSWORD=$tenant_b_password"
            echo "TIMELINE_TEST_NO_TENANT_PASSWORD=$no_tenant_password"
            echo "ACTION_PLAN_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "ACTION_PLAN_TEST_TENANT_B_PASSWORD=$tenant_b_password"
            echo "ACTION_PLAN_TEST_NO_TENANT_PASSWORD=$no_tenant_password"
            echo "PROJECTS_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "PROJECTS_TEST_TENANT_B_PASSWORD=$tenant_b_password"
            echo "FOUNDATION_UI_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "PIPELINE_TEST_TENANT_A_PASSWORD=$tenant_a_password"
            echo "PIPELINE_TEST_TENANT_B_PASSWORD=$tenant_b_password"
          } >> "$GITHUB_ENV"

      - name: Start local Supabase
        run: supabase start > /dev/null

      - name: Export local Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > supabase-status.env
          set -a
          source supabase-status.env
          set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$DB_URL"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "QA_SUPABASE_URL=$API_URL"
            echo "QA_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "QA_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Apply canonical migrations
        run: supabase migration up --local

      - name: Verify migrated schema and RLS catalog
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.projects') is null then
              raise exception 'public.projects is missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'tasks' and column_name = 'project_id'
            ) then
              raise exception 'tasks.project_id is missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'interactions' and column_name = 'project_id'
            ) then
              raise exception 'interactions.project_id is missing';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'timeline_events' and column_name = 'project_id'
            ) then
              raise exception 'timeline_events.project_id is missing';
            end if;
            if not exists (
              select 1 from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relname = 'projects' and c.relrowsecurity
            ) then
              raise exception 'RLS is not enabled on public.projects';
            end if;
            if not has_table_privilege('authenticated', 'public.projects', 'select') then
              raise exception 'authenticated role cannot select public.projects';
            end if;
            if not has_table_privilege('authenticated', 'public.people', 'select') then
              raise exception 'authenticated role cannot select public.people';
            end if;
            if not exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'projects'
                and policyname in (
                  'projects_select_for_members',
                  'projects_insert_for_recruiting_roles',
                  'projects_update_for_recruiting_roles'
                )
              group by tablename
              having count(*) = 3
            ) then
              raise exception 'Expected projects RLS policies are missing';
            end if;
            if to_regclass('public.recruitment_pipeline_events') is null then
              raise exception 'public.recruitment_pipeline_events is missing';
            end if;
            if not exists (
              select 1 from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relname = 'recruitment_pipeline_events' and c.relrowsecurity
            ) then
              raise exception 'RLS is not enabled on public.recruitment_pipeline_events';
            end if;
            if not has_function_privilege('authenticated', 'public.transition_recruitment_pipeline(uuid, uuid, text, text, timestamp with time zone, boolean, text, timestamp with time zone, timestamp with time zone, text, text, boolean, timestamp with time zone, boolean, jsonb)', 'execute') then
              raise exception 'authenticated role cannot execute transition_recruitment_pipeline';
            end if;
            if to_regclass('public.csv_import_runs') is null then
              raise exception 'public.csv_import_runs is missing';
            end if;
            if not exists (
              select 1 from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relname = 'csv_import_runs' and c.relrowsecurity
            ) then
              raise exception 'RLS is not enabled on public.csv_import_runs';
            end if;
            if not has_table_privilege('authenticated', 'public.csv_import_runs', 'select') then
              raise exception 'authenticated role cannot select public.csv_import_runs';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'csv_import_runs'
                and column_name = 'payload_fingerprint'
            ) then
              raise exception 'public.csv_import_runs.payload_fingerprint is missing';
            end if;
            if has_table_privilege('authenticated', 'public.csv_import_runs', 'insert') then
              raise exception 'authenticated role must not insert public.csv_import_runs directly';
            end if;
            if has_function_privilege('authenticated', 'public.execute_csv_import(uuid, text, text, text, jsonb, uuid)', 'execute') then
              raise exception 'authenticated role must not execute execute_csv_import directly';
            end if;
            if has_function_privilege('anon', 'public.execute_csv_import(uuid, text, text, text, jsonb, uuid)', 'execute') then
              raise exception 'anon role must not execute execute_csv_import';
            end if;
            if has_function_privilege('service_role', 'public.execute_csv_import(uuid, text, text, text, jsonb, uuid)', 'execute') then
              raise exception 'service_role must not execute legacy execute_csv_import';
            end if;
            if has_function_privilege('authenticated', 'public.execute_csv_import(uuid, text, text, text, jsonb, uuid, boolean)', 'execute') then
              raise exception 'authenticated role must not execute pipeline-enabled execute_csv_import directly';
            end if;
            if has_function_privilege('anon', 'public.execute_csv_import(uuid, text, text, text, jsonb, uuid, boolean)', 'execute') then
              raise exception 'anon role must not execute pipeline-enabled execute_csv_import';
            end if;
            if not has_function_privilege('service_role', 'public.execute_csv_import(uuid, text, text, text, jsonb, uuid, boolean)', 'execute') then
              raise exception 'service_role must execute server-only pipeline-enabled execute_csv_import';
            end if;
            if not exists (
              select 1 from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relname = 'csv_import_cancellations' and c.relrowsecurity
            ) then
              raise exception 'RLS is not enabled on public.csv_import_cancellations';
            end if;
            if has_table_privilege('authenticated', 'public.csv_import_cancellations', 'insert') then
              raise exception 'authenticated role must not insert public.csv_import_cancellations directly';
            end if;
            if not has_function_privilege('authenticated', 'public.cancel_csv_import(uuid, uuid, text, uuid, boolean)', 'execute') then
              raise exception 'authenticated role cannot execute cancel_csv_import';
            end if;
            if has_function_privilege('anon', 'public.cancel_csv_import(uuid, uuid, text, uuid, boolean)', 'execute') then
              raise exception 'anon role must not execute cancel_csv_import';
            end if;
          end $$;
          notify pgrst, 'reload schema';
          SQL
          sleep 5

      - name: Restart local Supabase after migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase stop
          supabase start > /dev/null
          supabase status -o env > supabase-status.env
          set -a
          source supabase-status.env
          set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$DB_URL"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "QA_SUPABASE_URL=$API_URL"
            echo "QA_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "QA_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Verify PostgREST schema cache
        run: node scripts/verify-supabase-qa.mjs

      - name: Simulate Supabase Test Reset locally
        run: node scripts/supabase-reset-local-simulation.mjs

      - name: Seed fictitious QA data
        run: node scripts/seed-supabase-qa.mjs


      - name: Verify local logical backup restoration
        shell: bash
        run: |
          set -euo pipefail
          # This check only accepts the ephemeral CI database, never a hosted project.
          node --input-type=module <<'JS'
          const url = new URL(process.env.QA_DB_URL);
          if (process.env.CI !== "true" || !["127.0.0.1", "localhost"].includes(url.hostname)
              || url.port !== "54322" || url.pathname !== "/postgres" || url.search) {
            throw new Error("Backup verification requires the local CI database.");
          }
          JS
          umask 077
          backup_dir="$(mktemp -d)"
          restore_db="atlas_restore_$(openssl rand -hex 8)"
          restore_url="${QA_DB_URL%/postgres}/$restore_db"
          created=false
          cleanup() {
            if [ "$created" = true ]; then
              psql "$QA_DB_URL" -X -v ON_ERROR_STOP=1 -q -c "DROP DATABASE \"$restore_db\";" >/dev/null
            fi
            if [ -n "${db_container:-}" ] && [ -n "${container_dump:-}" ]; then
              docker exec "$db_container" rm -f "$container_dump" >/dev/null 2>&1 || true
            fi
            rm -rf "$backup_dir"
          }
          trap cleanup EXIT
          cat > "$backup_dir/manifest.sql" <<'SQL'
          create temporary table restore_manifest (object_name text, row_count bigint, digest text, rls boolean);
          do $atlas_restore$
          declare t record;
          begin
            for t in
              select n.nspname, c.relname, c.relrowsecurity
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'auth', 'storage') and c.relkind = 'r'
              order by n.nspname, c.relname
            loop
              execute format(
                'insert into restore_manifest select %L, count(*), md5(coalesce(string_agg(to_jsonb(r)::text, E''\\n'' order by to_jsonb(r)::text), '''')), %L from %I.%I r',
                t.nspname || '.' || t.relname, t.relrowsecurity, t.nspname, t.relname
              );
            end loop;
          end $atlas_restore$;
          select object_name, row_count, digest, rls from restore_manifest order by object_name;
          select schemaname, tablename, policyname, permissive, roles, cmd, qual, with_check
          from pg_policies where schemaname in ('public', 'auth', 'storage')
          order by schemaname, tablename, policyname;
          SQL
          psql "$QA_DB_URL" -X -v ON_ERROR_STOP=1 -qAt -f "$backup_dir/manifest.sql" > "$backup_dir/before"
          # Dump and restore with the matching PostgreSQL tools bundled in the
          # ephemeral local Supabase database container.
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -1)"
          if [ -z "$db_container" ]; then
            echo "Local Supabase database container was not found."
            exit 1
          fi
          container_dump="/tmp/$restore_db.dump"
          docker exec "$db_container" pg_dump --username=supabase_admin --dbname=postgres --format=custom --file="$container_dump"
          psql "$QA_DB_URL" -X -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE \"$restore_db\" TEMPLATE template0;" >/dev/null
          created=true
          # Restore as the managed local admin role, without granting extra
          # privileges to the application's connection role.
          # Capture errors privately; never print restored data or credentials.
          if ! docker exec "$db_container" pg_restore --username=supabase_admin --dbname="$restore_db" --exit-on-error --no-owner "$container_dump" 2>"$backup_dir/restore-errors"; then
            echo "Logical restore failed; database object error summary:"
            sed -n 's/^pg_restore: error: /ERROR: /p' "$backup_dir/restore-errors" | head -5
            exit 1
          fi
          psql "$restore_url" -X -v ON_ERROR_STOP=1 -qAt -f "$backup_dir/manifest.sql" > "$backup_dir/after"
          if ! cmp -s "$backup_dir/before" "$backup_dir/after"; then
            echo "Restored table contents, row counts, RLS flags or policies differ."
            exit 1
          fi
          echo "Local logical backup restored: table contents, row counts, RLS flags and policies match."
          echo "Only fictitious CI data was used; no remote database was contacted."

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: RLS and integration tests
        run: npm run integration

      - name: Start Next.js app
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > next.log 2>&1 &
          echo "$!" > next.pid
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat next.log
          exit 1
        working-directory: apps/web

      - name: E2E tests
        run: npm --workspace apps/web run e2e -- e2e/foundation-ui.e2e.spec.ts e2e/projects.e2e.spec.ts e2e/relationships.e2e.spec.ts e2e/recruitment-pipeline.e2e.spec.ts e2e/recruitment-pipeline-ui.e2e.spec.ts e2e/csv-import-history.e2e.spec.ts --workers=1

      - name: Upload Pipeline visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-visual-qa
          path: apps/web/test-results/**/pipeline-visual-qa/*.png
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-supabase-failure-artifacts
          path: |
            apps/web/next.log
            apps/web/playwright-report
            apps/web/test-results

      - name: Stop services
        if: always()
        shell: bash
        run: |
          if [ -f apps/web/next.pid ]; then
            kill "$(cat apps/web/next.pid)" || true
          fi
          supabase stop || true
