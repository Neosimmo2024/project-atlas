name: LMD resume checks
on:
  push:
    branches: [fix/lmd-resume-and-provider-schedule]
permissions:
  contents: read
jobs:
  provider-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @project-atlas/web
      - run: npm exec --workspace @project-atlas/web -- vitest run src/services/lmd-single-send.test.ts
