name: VSC isolated checks

on:
  pull_request:
    paths:
      - 'apps/web/src/features/vsc-campaign/**'
      - 'apps/web/src/services/vsc-*.ts'
      - 'apps/web/src/app/api/admin/vsc-*/**'
      - 'apps/web/src/components/vsc-*.tsx'
      - 'apps/web/src/app/(app)/admin/ovh-connection/**'
      - 'supabase/migrations/*vsc*.sql'
      - 'supabase/tests/vsc-isolation.sql'
      - '.github/workflows/vsc-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vsc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated VSC unit tests
        working-directory: apps/web
        run: npx vitest run src/features/vsc-campaign src/services/vsc-campaign-email.test.ts src/services/vsc-campaign-drafts.test.ts src/services/vsc-inbound-reply-journal.test.ts
      - name: Run VSC service tests
        working-directory: apps/web
        run: npx vitest run src/services/vsc-*.test.ts
      - name: Validate VSC migration SQL syntax (offline)
        run: |
          python3 -m pip install --quiet pglast==7.21
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          migrations = sorted(Path('supabase/migrations').glob('*vsc*.sql'))
          assert migrations, 'No VSC migration files found'
          for migration in migrations:
              parse_sql(migration.read_text())
              print(f'Parsed: {migration.name}')
          PY
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck

  vsc-migrations:
    name: VSC isolated Supabase migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start disposable local Supabase
        run: supabase start > /dev/null
      - name: Apply all local migrations
        run: supabase migration up --local
      - name: Verify VSC schema, RLS, and RPC grants
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare table_name text;
          begin
            foreach table_name in array array['vsc_campaigns','vsc_campaign_deliveries','vsc_inbound_replies']
            loop
              if not exists (
                select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='public' and c.relname=table_name and c.relrowsecurity
              ) then raise exception 'VSC RLS missing: %', table_name; end if;
            end loop;
            if has_function_privilege('authenticated',
              'public.vsc_record_verified_reply(uuid,uuid,uuid,text,timestamptz)', 'EXECUTE')
            then raise exception 'Authenticated role can invoke VSC reply RPC'; end if;
            if not has_function_privilege('service_role',
              'public.vsc_record_verified_reply(uuid,uuid,uuid,text,timestamptz)', 'EXECUTE')
            then raise exception 'Service role cannot invoke VSC reply RPC'; end if;
          end $$;
          SQL
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/vsc-isolation.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
